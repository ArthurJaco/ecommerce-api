spring.application.name=ecommerce-api

# Conexao com o Postgres que sobe via docker-compose
spring.datasource.url=jdbc:postgresql://localhost:5436/ecommerce
spring.datasource.username=ecommerce_user
spring.datasource.password=ecommerce_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate cria/atualiza as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI disponivel em /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

server.port=${PORT:8080}